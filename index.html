<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>송금대상액 계산기</title>
<meta name="theme-color" content="#9ACD32">
<!-- 아이폰 -->
<link rel="apple-touch-icon" href="/images/icon-180.png">
<!-- 안드로이드 -->
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<!-- PWA -->
<link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png">
<meta name="apple-mobile-web-app-title" content="송금계산기">
<meta name="application-name" content="송금계산기">
    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}

body {
    background: #f6f7f8;
    padding: 10px 14px;
    max-width: 500px; /* 모바일 최적화를 위해 최대 너비 축소 */
    margin: auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* 위아래 균등 배치 */
}

h1 {
    text-align: center;
    margin-bottom: 8px;
    color: #4d6b00;
    font-size: 22px; /* 타이틀 크기 축소 */
}

.card {
    background: white;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.label {
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 14px;
}

#targetAmount {
    width: 100%;
    height: 36px; /* 높이 축소 */
    font-size: 18px;
    padding: 6px 10px;
    border: 2px solid #cfe58b;
    border-radius: 10px;
}

/* 화폐 리스트 카드의 여백 타이트하게 조정 */
#moneyList.card {
    padding-top: 4px;
    padding-bottom: 4px;
    margin-bottom: 8px;
}

.money-item {
    display: grid;
    grid-template-columns: 55px 34px 48px 34px 1fr; /* 간격 축소 */
    align-items: center;
    gap: 4px;
    padding: 4px 0; /* 위아래 패딩 대폭 축소 */
    border-bottom: 1px solid #f0f0f0;
}

.money-item:last-child {
    border-bottom: none;
}

.denom {
    font-weight: 700;
    font-size: 14px;
}

.action-btn {
    width: 28px; /* 버튼 크기 축소 */
    height: 28px;
    border: none;
    border-radius: 8px;
    background: #9ACD32;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.qty {
    width: 100%;
    height: 32px; /* 인풋 높이 축소 */
    text-align: center;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.amount {
    text-align: right;
    font-weight: 700;
    font-size: 14px;
}

.summary {
    text-align: center;
    padding: 8px 12px;
    margin-bottom: 8px;
}

.summary > div:first-child {
    font-size: 13px;
    color: #666;
}

.total {
    font-size: 26px; /* 총액 글자 크기 축소 */
    font-weight: 800;
    color: #4d6b00;
    line-height: 1.2;
}

.diff {
    margin-top: 2px;
    font-size: 15px;
}

.status {
    margin-top: 6px;
    padding: 6px; /* 상태창 패딩 축소 */
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
}

.match { background: #e8f5d0; color: #4d6b00; }
.short { background: #fdeaea; color: #c62828; }
.over { background: #eaf2ff; color: #1565c0; }

.reset-btn {
    width: 100%;
    height: 44px; /* 버튼 높이 축소 */
    border: none;
    border-radius: 10px;
    background: #4d6b00;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px; /* 최하단 고정 지원 */
}

/* 초소형 화면 대응 */
@media(max-width: 360px) {
    .money-item {
        grid-template-columns: 50px 28px 40px 28px 1fr;
    }
    .denom, .amount { font-size: 12px; }
}
</style>
</head>

<body>

<div>
    <h1>송금대상액 계산기</h1>

    <div class="card">
        <div class="label">송금대상금액</div>
        <input id="targetAmount" type="number" placeholder="금액 입력">
    </div>

    <div class="card" id="moneyList"></div>

    <div class="card summary">
        <div>총액</div>
        <div id="total" class="total">0원</div>
        <div id="difference" class="diff">차이 : 0원</div>
        <div id="status" class="status match">🟢 정확히 일치</div>
    </div>
    <button id="resetBtn" class="reset-btn">초기화</button>
</div>


<script>
const moneyData = [
    { label: "10만원", value: 100000 },
    { label: "5만원", value: 50000 },
    { label: "1만원", value: 10000 },
    { label: "5천원", value: 5000 },
    { label: "1천원", value: 1000 },
    { label: "500원", value: 500 },
    { label: "100원", value: 100 },
    { label: "50원", value: 50 },
    { label: "10원", value: 10 }
];

const moneyList = document.getElementById("moneyList");
const targetAmountInput = document.getElementById("targetAmount");
const totalDisplay = document.getElementById("total");
const diffDisplay = document.getElementById("difference");
const statusDisplay = document.getElementById("status");
const resetBtn = document.getElementById("resetBtn");

const qtyInputs = [];
const sumOutputs = [];

let htmlString = "";
moneyData.forEach((item, index) => {
    htmlString += `
        <div class="money-item">
            <div class="denom">${item.label}</div>
            <button class="action-btn minus" data-index="${index}">-</button>
            <input class="qty" type="number" value="0" min="0" data-index="${index}">
            <button class="action-btn plus" data-index="${index}">+</button>
            <div class="amount">0원</div>
        </div>
    `;
});
moneyList.innerHTML = htmlString;

moneyList.querySelectorAll('.qty').forEach(el => qtyInputs.push(el));
moneyList.querySelectorAll('.amount').forEach(el => sumOutputs.push(el));

function calculate() {
    let total = 0;

    moneyData.forEach((item, index) => {
        const qty = Number(qtyInputs[index].value) || 0;
        const sum = qty * item.value;
        total += sum;
        
        sumOutputs[index].textContent = sum.toLocaleString() + "원";
    });

    totalDisplay.textContent = total.toLocaleString() + "원";

    const target = Number(targetAmountInput.value) || 0;
    const diff = target - total;

    diffDisplay.textContent = "차이 : " + diff.toLocaleString() + "원";

    statusDisplay.className = "status"; 
    if (diff === 0) {
        statusDisplay.classList.add("match");
        statusDisplay.textContent = "🟢 정확히 일치";
    } else if (diff > 0) {
        statusDisplay.classList.add("short");
        statusDisplay.textContent = `🔴 ${diff.toLocaleString()}원 부족`;
    } else {
        statusDisplay.classList.add("over");
        statusDisplay.textContent = `🔵 ${Math.abs(diff).toLocaleString()}원 초과`;
    }
}

moneyList.addEventListener('click', (e) => {
    if (!e.target.classList.contains('action-btn')) return;
    
    const index = Number(e.target.dataset.index);
    const amount = e.target.classList.contains('plus') ? 1 : -1;
    const input = qtyInputs[index];
    
    let value = (Number(input.value) || 0) + amount;
    if (value < 0) value = 0;
    
    input.value = value;
    calculate();
});

moneyList.addEventListener('input', (e) => {
    if (e.target.classList.contains('qty')) {
        calculate();
    }
});

targetAmountInput.addEventListener('input', calculate);

resetBtn.addEventListener('click', () => {
    targetAmountInput.value = "";
    qtyInputs.forEach(input => input.value = 0);
    calculate();
});

calculate();
</script>

</body>
</html>
